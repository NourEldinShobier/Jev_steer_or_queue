name: router
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
permissions:
  contents: write
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: windows-latest, target: x86_64-pc-windows-msvc, asset: jev-router-windows-x64.exe, bin: jev-router.exe }
          - { os: macos-latest, target: aarch64-apple-darwin, asset: jev-router-macos-arm64, bin: jev-router }
          - { os: macos-latest, target: x86_64-apple-darwin, asset: jev-router-macos-x64, bin: jev-router }
          - { os: ubuntu-latest, target: x86_64-unknown-linux-gnu, asset: jev-router-linux-x64, bin: jev-router }
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: claude-code/router
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - run: rustup target add ${{ matrix.target }}
      - run: cargo test --release
        if: matrix.target != 'x86_64-apple-darwin'
      - run: cargo build --release --target ${{ matrix.target }}
      - run: cp target/${{ matrix.target }}/release/${{ matrix.bin }} ${{ matrix.asset }}
      - name: Attach to the release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1 || gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --notes "Rust router binaries." ; gh release upload "$GITHUB_REF_NAME" ${{ matrix.asset }} --clobber
